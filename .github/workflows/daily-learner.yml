name: Daily Learner

on:
  schedule:
    # 매일 00:00 KST = 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "몇 시간 전까지 볼지 (기본 25, 30일=720)"
        required: false
        default: "25"

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run learner
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '25' }}
        run: python learner.py

      - name: Auto-commit learned rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet learned_rules.json || {
            git add learned_rules.json
            git commit -m "chore: auto-learn from Slack $(date -u +%Y-%m-%d)"
            git push
          }
